services:
  - type: web
    runtime: static
    name: asu-agriculture-research-portal
    buildCommand: echo "No build required - static portal"
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
